spring:
  application:
    name: harness-payment-service
  profiles:
    default: local
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        payments.pg.latency: true
        payments.db.transaction.duration: true
        payments.db.lock.wait: true
        payments.outbox.publish.lag: true
        payments.outbox.claim.duration: true

payments:
  pg:
    mode: ${PAYMENTS_PG_MODE:fake}
    base-url: ${PAYMENTS_PG_BASE_URL:http://localhost:8090}
    connect-timeout: PT0.3S
    read-timeout: PT2S
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:local-webhook-secret}
    webhook-max-age: PT5M
  runtime:
    instance-id: ${PAYMENTS_INSTANCE_ID:${random.uuid}}
  idempotency:
    redis-gate:
      enabled: false
      ttl: PT30S
  outbox:
    relay:
      lease-duration: PT30S
  provider-protection:
    command-max-concurrent: 16
    inquiry-max-concurrent: 4
    inquiry-queue-capacity: 4
    max-concurrent-retries: 2
    command-timeout: PT2S
    inquiry-timeout: PT0.5S
    inquiry-request-budget: PT2S
    inquiry-max-attempts: 3
    retry-initial-backoff: PT0.05S
    circuit-sliding-window-size: 10
    circuit-minimum-calls: 5
    circuit-failure-rate-threshold: 50
    circuit-open-duration: PT5S
    circuit-half-open-calls: 2
  recovery:
    scheduler-enabled: false
    fixed-delay: PT30S

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"

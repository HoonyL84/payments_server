spring:
  application:
    name: harness-payment-service
  profiles:
    default: local
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        payments.pg.latency: true
        payments.db.transaction.duration: true
        payments.db.lock.wait: true
        payments.outbox.publish.lag: true
        payments.outbox.claim.duration: true

payments:
  runtime:
    instance-id: ${PAYMENTS_INSTANCE_ID:${random.uuid}}
  idempotency:
    redis-gate:
      enabled: false
      ttl: PT30S
  outbox:
    relay:
      lease-duration: PT30S
  recovery:
    scheduler-enabled: false
    fixed-delay: PT30S

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"
spring:
  application:
    name: mock-pg-server
  datasource:
    url: ${MOCK_PG_DB_URL:jdbc:h2:file:./data/mock-pg;MODE=MySQL;AUTO_SERVER=TRUE}
    username: sa
    password:
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8090}

mock-pg:
  webhook:
    url: ${PAYMENTS_WEBHOOK_URL:http://localhost:8080/api/v1/pg/webhooks}
    secret: ${PAYMENTS_WEBHOOK_SECRET:local-webhook-secret}
x-payment-environment: &payment-environment
  SPRING_PROFILES_ACTIVE: k6
  PAYMENTS_DB_URL: jdbc:mysql://mysql:3306/payments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  PAYMENTS_DB_USERNAME: payments
  PAYMENTS_DB_PASSWORD: payments
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SERVER_PORT: 8080
  PAYMENTS_PROVIDER_PROTECTION_COMMAND_MAX_CONCURRENT: 10
  PAYMENTS_PROVIDER_PROTECTION_INQUIRY_MAX_CONCURRENT: 2
  PAYMENTS_PROVIDER_PROTECTION_INQUIRY_QUEUE_CAPACITY: 2
  PAYMENTS_PROVIDER_PROTECTION_MAX_CONCURRENT_RETRIES: 2
  PAYMENTS_PROVIDER_PROTECTION_COMMAND_TIMEOUT: PT0.5S
  PAYMENTS_PROVIDER_PROTECTION_INQUIRY_TIMEOUT: PT0.15S
  PAYMENTS_PROVIDER_PROTECTION_INQUIRY_REQUEST_BUDGET: PT0.7S
  PAYMENTS_PROVIDER_PROTECTION_INQUIRY_MAX_ATTEMPTS: 3
  PAYMENTS_PROVIDER_PROTECTION_RETRY_INITIAL_BACKOFF: PT0.05S
  PAYMENTS_PROVIDER_PROTECTION_CIRCUIT_SLIDING_WINDOW_SIZE: 8
  PAYMENTS_PROVIDER_PROTECTION_CIRCUIT_MINIMUM_CALLS: 4
  PAYMENTS_PROVIDER_PROTECTION_CIRCUIT_OPEN_DURATION: PT2S

x-payment-app: &payment-app
  build:
    context: .
  image: payments-service:local
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    container_name: payments-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payments
      MYSQL_USER: payments
      MYSQL_PASSWORD: payments
    ports:
      - "3306:3306"
    volumes:
      - payments_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  reconciliation-mysql:
    image: mysql:8.4
    container_name: payments-reconciliation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payments_reconciliation
      MYSQL_USER: payments
      MYSQL_PASSWORD: payments
    ports:
      - "3307:3306"
    volumes:
      - reconciliation_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-pg:
    build:
      context: .
      dockerfile: mock-pg-server/Dockerfile
    image: mock-pg-server:local
    container_name: payments-mock-pg
    environment:
      SERVER_PORT: 8090
      MOCK_PG_DB_URL: jdbc:h2:file:/app/data/mock-pg;MODE=MySQL;AUTO_SERVER=TRUE
      PAYMENTS_WEBHOOK_URL: http://app-http:8080/api/v1/pg/webhooks
      PAYMENTS_WEBHOOK_SECRET: local-webhook-secret
    ports:
      - "8090:8090"
    volumes:
      - mock_pg_data:/app/data

  app-one:
    <<: *payment-app
    environment:
      <<: *payment-environment
      PAYMENTS_INSTANCE_ID: app-one
    ports:
      - "8081:8080"

  app-two:
    <<: *payment-app
    environment:
      <<: *payment-environment
      PAYMENTS_INSTANCE_ID: app-two
    ports:
      - "8082:8080"

  app-http:
    <<: *payment-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      mock-pg:
        condition: service_started
    environment:
      <<: *payment-environment
      PAYMENTS_INSTANCE_ID: app-http
      PAYMENTS_PG_MODE: http
      PAYMENTS_PG_BASE_URL: http://mock-pg:8090
      PAYMENTS_WEBHOOK_SECRET: local-webhook-secret
      PAYMENTS_OUTBOX_PUBLISHER: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8080"

  payment-consumer:
    build:
      context: .
      dockerfile: payment-event-consumer/Dockerfile
    image: payment-event-consumer:local
    depends_on:
      app-http:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      PAYMENTS_DB_URL: jdbc:mysql://mysql:3306/payments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PAYMENTS_DB_USERNAME: payments
      PAYMENTS_DB_PASSWORD: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  reconciliation-batch:
    build:
      context: .
      dockerfile: reconciliation-batch/Dockerfile
    image: reconciliation-batch:local
    depends_on:
      reconciliation-mysql:
        condition: service_healthy
      mock-pg:
        condition: service_started
    environment:
      PAYMENTS_DB_URL: jdbc:mysql://reconciliation-mysql:3306/payments_reconciliation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
      PAYMENTS_DB_USERNAME: payments
      PAYMENTS_DB_PASSWORD: payments
      MOCK_PG_BASE_URL: http://mock-pg:8090
      RECONCILIATION_DATASET_ENABLED: "true"
      SERVER_PORT: 8092
    ports:
      - "8092:8092"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: payments-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    container_name: payments-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  redis:
    image: redis:7-alpine
    container_name: harness-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: harness-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: harness-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: 604800000

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: harness-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  payments_mysql_data:
  reconciliation_mysql_data:
  mock_pg_data:
  redis_data:
  es_data:

global:
  scrape_interval: 5s
scrape_configs:
  - job_name: payments-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: payments-multi-instance
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-one:8080", "app-two:8080"]
